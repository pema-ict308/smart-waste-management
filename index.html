<!DOCTYPE html>
<head>
    <title>Smart Waste Management System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <nav class="navbar" id="navbar" style="display: none;">
        <div class="logo">B</div>
        <div class="nav-links">
            <a href="javascript:void(0)" onclick="showPage('dashboard')">Home</a>
            <a href="javascript:void(0)" onclick="showPage('schedule')">Schedule</a>
            <a href="javascript:void(0)" onclick="showPage('insights')">Insights</a>
            <a href="javascript:void(0)" onclick="showPage('alert')">Alert</a>
            <a href="javascript:void(0)" onclick="showPage('bin')">Bin</a>
            <a href="javascript:void(0)" onclick="showPage('profile')">Profile</a>
        </div>
    </nav>
    <div id="app-viewport"></div>
    <script src="script.js"></script>
    
    <Script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://smart-bin-system-71b37-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const binRef = ref(database, "smartbin");

        window.latestBinData = null;

        window.updateFirebaseDisplay = function () {
            const data = window.latestBinData;
            if (!data) return;

            const binId = document.getElementById("binId");
            const distance = document.getElementById("distance");
            const status = document.getElementById("status");
            const location = document.getElementById("location");

            if (binId && distance && status && location) {
                binId.innerText = data.binId;
                distance.innerText = data.distance + " cm";
                status.innerText = data.status;
                location.innerText = data.location;
            }
        };

onValue(binRef, (snapshot) => {
    const data = snapshot.val();

    window.latestBinData = data;

    myBins = [{
        id: data.binId,
        type: "General Waste",
        loc: data.location,
        status: data.status,
        isFaulty: false
    }];

    if (window.updateFirebaseDisplay) {
        window.updateFirebaseDisplay();
    }

    if (document.getElementById("d-total")) {
        updateDash();
    }
});

    </script>
</body>
</html>
